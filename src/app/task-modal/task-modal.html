<form class="form" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
  <label for="title">Title</label>
  <input id="title" type="text" formControlName="title"/>

  <label for="description">Description</label>
  <input id="description" type="text" formControlName="description"/>

  <label for="completed">Completion</label>
  <input id="completed" type="checkbox" formControlName="completed"/>

  <label for="deadline">Deadline</label>
  <input id="deadline" type="date" formControlName="deadline"/>

  <label for="priority">Priority:</label>

  <select id="priority" formControlName="priority">
    @for (p of priorityOptions; track p) {
      <option [value]="p">{{ p }}</option>
    }
  </select>

  <button type="submit" [disabled]="taskForm.invalid">Create</button>
</form>
